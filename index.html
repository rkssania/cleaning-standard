<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Уборка">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Стандарт уборки</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #767676;
    --line: #e4e4e4;
    --soft: #f4f4f4;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  /* Emoji are shown in monochrome to keep the page black and white. */
  .e, .ico, .room-ico, .big, .badge, .legend b { filter: grayscale(1) contrast(1.15); }
  svg.ic { width: 1em; height: 1em; vertical-align: -0.12em; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--ink);
    padding-top: env(safe-area-inset-top);
  }
  .head-row { display: flex; align-items: center; gap: 12px; padding-top: 10px; }
  h1 { font-size: 17px; line-height: 1.25; margin: 0; flex: 1; font-weight: 700; letter-spacing: -.01em; }
  .lang { display: flex; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .lang button {
    border: 0; background: transparent; font: inherit; font-weight: 700; font-size: 14px;
    min-width: 46px; min-height: 38px; color: var(--ink); cursor: pointer;
  }
  .lang button.on { background: var(--ink); color: #fff; }
  .progress { margin-top: 10px; }
  .bar { height: 4px; background: var(--line); }
  .bar > div { height: 100%; width: 0; background: var(--ink); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 6px 0 10px; font-size: 15px; }
  .meta b { font-variant-numeric: tabular-nums; }
  .timer { font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 6px; padding: 0 8px; border: 1px solid transparent; }
  .timer.warn { border-color: var(--ink); }
  .timer.over { background: var(--ink); color: #fff; }

  main { padding-top: 8px; padding-bottom: calc(48px + env(safe-area-inset-bottom)); }

  /* "Add to Home Screen" hint, shown only in iPhone Safari before installing */
  .install {
    display: flex; align-items: flex-start; gap: 12px;
    border: 1px solid var(--ink); border-radius: var(--radius); padding: 12px 14px; margin: 12px 0 0;
  }
  .install .txt { flex: 1; font-size: 15px; }
  .install b { display: block; font-size: 16px; margin-bottom: 2px; }
  .install svg { width: 18px; height: 18px; vertical-align: -3px; }
  .install button {
    border: 0; background: transparent; font: inherit; font-size: 22px; line-height: 1;
    width: 40px; height: 40px; margin: -8px -8px 0 0; cursor: pointer; color: var(--ink);
  }
  h2 {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
    margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  h2.floor { color: var(--muted); border-bottom: 0; margin: 24px 0 8px; padding: 0; }
  h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; }

  .box { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .box.plain { border: 0; padding: 0 0 4px; }
  /* Strong accent: inverted block */
  .box.inverse { background: var(--ink); color: #fff; border-color: var(--ink); }
  .box.inverse .big { filter: grayscale(1) brightness(1.4); }

  /* Rules with icons */
  .rule { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
  .rule .big { font-size: 26px; width: 40px; text-align: center; flex-shrink: 0; position: relative; }
  .rule .big.no::after {
    content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 3px;
    background: #fff; transform: rotate(-35deg);
  }
  .flow { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; padding: 6px 0 10px; }
  .chip {
    position: relative; display: flex; flex-direction: column; align-items: center;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px 6px;
    font-size: 12px; line-height: 1.2; text-align: center;
  }
  .chip .e { font-size: 24px; line-height: 1.25; }
  .chip .n {
    position: absolute; top: -7px; left: -5px; width: 19px; height: 19px; border-radius: 50%;
    background: var(--ink); color: #fff; font-weight: 700; font-size: 11px;
    display: grid; place-content: center;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 8px; }
  .legend span { border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px; font-size: 14px; }
  .legend span.attn { background: var(--ink); color: #fff; border-color: var(--ink); }
  .legend b { font-size: 18px; vertical-align: -2px; }
  .norm { font-size: 17px; font-weight: 700; padding-top: 4px; }

  /* Checklist steps: one checkbox per finished stage */
  .step {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer;
  }
  .step:first-child { border-top: 0; }
  .step .body { flex: 1; min-width: 0; }
  .step .head { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .step .head .e { font-size: 22px; line-height: 1; }
  .step .head .t { font-weight: 700; font-size: 18px; flex: 1; }
  .badge {
    font-size: 13px; font-weight: 700; border: 1px solid var(--ink); border-radius: 20px;
    padding: 2px 10px; flex-shrink: 0; white-space: nowrap;
  }
  .badge.attn { background: var(--ink); color: #fff; }
  .subs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sub {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 14px; line-height: 1.2; background: var(--soft); border-radius: 8px; padding: 4px 8px;
  }
  .sub .e { font-size: 16px; }
  .sub .ar { color: var(--muted); }
  /* Accent where attention is needed: glove changes, owner's product */
  .sub.attn { background: var(--ink); color: #fff; font-weight: 700; }
  .sub.attn .ar { color: #bbb; }
  .sub.attn .e { filter: grayscale(1) brightness(1.5); }
  .step input:checked ~ .body { opacity: .35; }
  .step input:checked ~ .body .t { text-decoration: line-through; }
  .step.critical { border: 2px solid var(--ink); border-radius: var(--radius); padding: 12px 10px; margin: 8px -6px; }
  .step.critical + .step { border-top: 0; }

  input[type=checkbox] {
    -webkit-appearance: none; appearance: none; flex-shrink: 0;
    width: 30px; height: 30px; margin: 0; border: 2px solid var(--ink); border-radius: 6px;
    background: #fff; display: grid; place-content: center; cursor: pointer;
  }
  input[type=checkbox]::after {
    content: ""; width: 8px; height: 15px; border: solid #fff; border-width: 0 3px 3px 0;
    transform: rotate(45deg) translate(-1px, -2px); opacity: 0;
  }
  input[type=checkbox]:checked { background: var(--ink); }
  input[type=checkbox]:checked::after { opacity: 1; }
  input[type=checkbox]:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 3px solid var(--ink); outline-offset: 2px;
  }

  /* Room cards */
  .card { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .card.done { border-color: var(--ink); }
  .card-head {
    width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border: 0; background: transparent; font: inherit; color: inherit;
    text-align: left; cursor: pointer;
  }
  .room-ico { font-size: 28px; width: 38px; text-align: center; flex-shrink: 0; line-height: 1; }
  .card-title { flex: 1; }
  .card-title b { display: block; font-size: 18px; }
  .card-title small { font-size: 15px; letter-spacing: 2px; filter: grayscale(1); }
  .count {
    font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px;
    border: 1px solid var(--ink); border-radius: 20px; padding: 2px 10px; white-space: nowrap;
  }
  .card.done .count { background: var(--ink); color: #fff; }
  .card.done .count::before { content: "✓ "; }
  .chev { width: 10px; height: 10px; border: solid var(--ink); border-width: 0 2px 2px 0; transform: rotate(45deg); margin: 0 4px 4px; transition: transform .2s; flex-shrink: 0; }
  .card.open .chev { transform: rotate(-135deg); margin-bottom: -4px; }
  .card-body { display: none; padding: 0 16px 8px; border-top: 1px solid var(--line); }
  .card.open .card-body { display: block; }

  /* Buttons */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 56px; padding: 12px 18px; margin: 10px 0;
    border: 1px solid var(--ink); border-radius: var(--radius); font: inherit; font-weight: 700; font-size: 17px;
    cursor: pointer; background: #fff; color: var(--ink); text-align: center;
  }
  .btn:active { transform: scale(.99); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary:disabled { background: #fff; color: var(--ink); cursor: default; }
  .btn.quiet { border-color: var(--line); color: var(--muted); font-weight: 400; }

  /* Supplies */
  .group { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 0 2px; }
  .group:first-child { margin-top: 0; }
  .supply { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .group + .supply { border-top: 0; }
  .supply label { flex: 1; display: flex; align-items: center; gap: 12px; cursor: pointer; min-height: 46px; }
  .supply .ico { font-size: 22px; width: 30px; text-align: center; flex-shrink: 0; line-height: 1; }
  .supply.low label .txt { font-weight: 700; }
  .supply.low { background: var(--soft); box-shadow: inset 4px 0 0 var(--ink); margin: 0 -16px; padding: 6px 16px; }
  .qty {
    width: 72px; min-height: 44px; font: inherit; text-align: center;
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: #fff;
  }
  textarea, .field {
    width: 100%; font: inherit; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; background: #fff; color: var(--ink);
  }
  textarea { min-height: 96px; resize: vertical; }
  .field { min-height: 56px; }
  .lbl { display: block; font-weight: 700; margin: 14px 0 6px; }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .note-video { border-left: 4px solid var(--ink); padding: 8px 12px; margin: 8px 0; font-weight: 700; }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  .video-ready { font-weight: 700; margin: 4px 0 0; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 16px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head-row">
      <h1 id="title"></h1>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <div class="progress">
      <div class="bar"><div id="bar"></div></div>
      <div class="meta">
        <span id="progressText"></span>
        <span id="timer" class="timer"></span>
      </div>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  // No emoji exists for these, so they are drawn inline in the text colour.

  // iOS share icon (square with an up arrow), used in the install hint.
  var SHARE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share">' +

  // Flat list of all checklist steps, in walk order, grouped by section.
  // section: { id, name, items: [{ id, step }] }
  function sectionItems(prefix, steps) {
    return steps.map(function (s, i) { return { id: prefix + '-' + i, step: s }; });
  }
  var SECTIONS = [];
  SECTIONS.push({ id: 'prep', name: UI.prep, items: sectionItems('prep', PREP) });
  FLOORS.forEach(function (f) {
    f.rooms.forEach(function (r) {
      r.items = sectionItems(r.id, r.steps);
      SECTIONS.push({ id: r.id, name: r.name, items: r.items, room: true });
    });
  });
  SECTIONS.push({ id: 'fin', name: UI.finish, items: sectionItems('fin', FINISH) });
  var ALL = [];
  var ROOM_ITEM = {};
  SECTIONS.forEach(function (s) {
    s.items.forEach(function (it) { ALL.push(it); if (s.room) ROOM_ITEM[it.id] = true; });
  });
  var SEND_ID = 'fin-' + (FINISH.length - 1);

  // ---------- Storage ----------
  var K_STATE = 'cleaning.state.v2', K_PHONE = 'cleaning.phone', K_LANG = 'cleaning.lang', K_HINT = 'cleaning.installHintClosed';
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

  function freshState() {
    return { checks: {}, start: null, end: null, open: {}, supplies: {}, other: '', notes: '' };
  }
  var state = freshState();
  try {
    var saved = JSON.parse(load(K_STATE) || 'null');
    if (saved && typeof saved === 'object') {
      Object.keys(state).forEach(function (k) { if (saved[k] != null) state[k] = saved[k]; });
    }
  } catch (e) {}
  var phone = load(K_PHONE) || '';
  var lang = load(K_LANG) === 'en' ? 'en' : 'ru';

  function save() { store(K_STATE, JSON.stringify(state)); }

  // ---------- Helpers ----------
  function tr(o) { return o[lang]; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function icon(i) { return SVG[i] || esc(i || ''); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function dmy(ms) { var d = new Date(ms); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); }
  function dur(min) { return Math.floor(min / 60) + ':' + pad(min % 60); }
  function elapsedMin() {
    if (!state.start) return 0;
    return Math.max(0, Math.floor(((state.end || Date.now()) - state.start) / 60000));
  }
  function doneCount(items) {
    var n = 0;
    items.forEach(function (it) { if (state.checks[it.id]) n++; });
    return n;
  }
  function supply(id) {
    if (!state.supplies[id]) state.supplies[id] = { on: false, qty: '' };
    return state.supplies[id];
  }
  function $(id) { return document.getElementById(id); }

  // Only iPhone/iPad Safari needs the manual "Add to Home Screen" hint.
  function showInstallHint() {
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    return ios && !standalone && !load(K_HINT);
  }

  // ---------- Render ----------
  function stepHtml(it) {
    var s = it.step;
    var h = '<label class="step' + (s.critical ? ' critical' : '') + '"><input type="checkbox" data-id="' + it.id + '"' +
      (state.checks[it.id] ? ' checked' : '') + '><span class="body"><span class="head">' +
      '<span class="e" aria-hidden="true">' + icon(s.t.icon) + '</span>' +
      '<span class="t">' + esc(tr(s.t)) + '</span>' +
      (s.gl ? '<span class="badge' + (s.gl.attn ? ' attn' : '') + '">' + s.gl.icon + ' ' + esc(tr(s.gl.t)) + '</span>' : '') +
      '</span>';
    if (s.subs) {
      h += '<span class="subs">' + s.subs.map(function (x, i) {
        return '<span class="sub' + (x.attn ? ' attn' : '') + '">' + (s.seq && i ? '<span class="ar">→</span>' : '') +
          '<span class="e" aria-hidden="true">' + icon(x.icon) + '</span>' + esc(tr(x)) + '</span>';
      }).join('') + '</span>';
    }
    return h + '</span></label>';
  }
  function chipsHtml(arr) {
    return '<div class="flow">' + arr.map(function (t, i) {
      return '<span class="chip"><span class="n">' + (i + 1) + '</span><span class="e">' + icon(t.icon) + '</span>' + esc(tr(t)) + '</span>';
    }).join('') + '</div>';
  }

          '<button type="button" class="card-head" data-toggle="' + r.id + '" aria-expanded="' + !!state.open[r.id] + '">' +
          '<span class="room-ico" aria-hidden="true">' + r.icon + '</span>' +

          '<div class="card-body">' + r.items.map(stepHtml).join('') + '</div></section>';

    // Supplies
    h += '<h2>' + esc(tr(UI.supplies)) + '</h2><div class="box plain">';
    SUPPLY_GROUPS.forEach(function (g) {
      h += '<div class="group">' + esc(tr(g.t)) + '</div>';
      g.items.forEach(function (s) {
        var st = supply(s[0]);
        h += '<div class="supply" data-supply-row="' + s[0] + '"><label><input type="checkbox" data-sup="' + s[0] + '"' +
          (st.on ? ' checked' : '') + '><span class="ico" aria-hidden="true">' + icon(s[1].icon) + '</span>' +
          '<span class="txt">' + esc(tr(s[1])) + '</span></label>' +
          '<input class="qty" type="text" inputmode="numeric" data-qty="' + s[0] + '" placeholder="' + esc(tr(UI.qty)) + '" aria-label="' + esc(tr(UI.qty)) + '"></div>';
      });
    });
    h += '<label class="lbl" for="other">' + esc(tr(UI.other)) + '</label>' +
      '<textarea id="other" placeholder="' + esc(tr(UI.otherPh)) + '"></textarea></div>';

    // Notes
    h += '<h2>' + esc(tr(UI.notes)) + '</h2><div class="box plain"><textarea id="notes" placeholder="' + esc(tr(UI.notesPh)) + '"></textarea></div>';

    // Finish
    h += '<h2>' + esc(tr(UI.finish)) + '</h2>';
    h += '<div class="box plain">' + SECTIONS[SECTIONS.length - 1].items.map(stepHtml).join('') + '</div>';
    h += '<div class="box plain"><label class="lbl" for="phone">' + esc(tr(UI.phone)) + '</label>' +
      '<input class="field" id="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="' + esc(tr(UI.phonePh)) + '">' +
      '<p class="hint">' + esc(tr(UI.phoneHint)) + '</p>' +
      '<div class="note-video">🎥 ' + esc(tr(UI.video)) + '</div>' +
      '<button type="button" class="btn primary" id="sendBtn">1. ' + esc(tr(UI.send)) + '</button>' +
      // Without the "capture" attribute iPhone offers both the camera and the photo library.
      '<input type="file" id="videoInput" class="vh" accept="video/*" tabindex="-1">' +
      '<label class="btn" for="videoInput" id="recordBtn">🎥 2. ' + esc(tr(videoFile ? UI.retakeVideo : UI.recordVideo)) + '</label>' +
      '<div id="videoBlock"' + (videoFile ? '' : ' hidden') + '>' +
        '<p class="video-ready" id="videoInfo">' + (videoFile ? videoLabel() : '') + '</p>' +
        '<button type="button" class="btn primary" id="shareVideo">3. ' + esc(tr(UI.shareVideo)) + '</button>' +
        '<p class="hint">' + esc(tr(UI.shareHint)) + '</p>' +

      '<button type="button" class="btn quiet" id="copyBtn">' + esc(tr(UI.copy)) + '</button></div>';
    h += '<button type="button" class="btn quiet" id="resetBtn">↺ ' + esc(tr(UI.reset)) + '</button>';

    $('app').innerHTML = h;

    // Free-text values are set as properties, never as HTML.
    SUPPLIES.forEach(function (s) { document.querySelector('[data-qty="' + s[0] + '"]').value = supply(s[0]).qty || ''; });
    $('other').value = state.other || '';
    $('notes').value = state.notes || '';

    refresh();

  function refresh() {
    var done = doneCount(ALL), total = ALL.length;
    var pct = total ? Math.floor(done * 100 / total) : 0;
    $('bar').style.width = pct + '%';
    $('progressText').innerHTML = '<b>' + pct + '% · ' + done + '/' + total + '</b>';

    SECTIONS.forEach(function (s) {
      if (!s.room) return;
      var d = doneCount(s.items);
      var el = document.querySelector('[data-count="' + s.id + '"]');
      if (el) el.textContent = d + '/' + s.items.length;
      var card = document.querySelector('[data-room="' + s.id + '"]');
      if (card) card.classList.toggle('done', d === s.items.length);
    });

    SUPPLIES.forEach(function (s) {
      var row = document.querySelector('[data-supply-row="' + s[0] + '"]');
      if (row) row.classList.toggle('low', !!supply(s[0]).on);
    });

    var sb = $('startBtn');
    if (sb) {
      sb.disabled = !!state.start;
      sb.textContent = state.start ? '⏱ ' + tr(UI.started) + hm(state.start) : '▶ ' + tr(UI.start);
    }
    tick();
  }

  function tick() {
    var el = $('timer');
    el.classList.remove('warn', 'over');
    if (!state.start) { el.textContent = tr(UI.notStarted); return; }
    var m = elapsedMin();
    var txt = dur(m) + ' ' + tr(UI.of) + ' ' + dur(NORM_MIN);
    if (m >= NORM_MIN) { el.classList.add('over'); txt += ' · ' + tr(UI.over); }
    else if (m >= WARN_MIN) { el.classList.add('warn'); }
    el.textContent = '⏱ ' + txt;
  }

  function startTimer() {
    if (!state.start) { state.start = Date.now(); state.end = null; }
  }

  // ---------- Report (always Russian) ----------
  function buildReport() {
    var now = Date.now();
    var L = [];
    L.push('🧹 Отчёт об уборке — ' + dmy(state.start || now));
    if (state.start) {
      var m = elapsedMin();
      L.push('Начало: ' + hm(state.start) + ', окончание: ' + hm(state.end || now));
      L.push('Длительность: ' + dur(m) + ' (норма ' + dur(NORM_MIN) + ')' + (m > NORM_MIN ? ' ⚠️ превышение' : ''));
    } else {
      L.push('Таймер не запускался');
    }
    var done = doneCount(ALL), total = ALL.length;
    L.push('Выполнено: ' + Math.floor(done * 100 / total) + '% (' + done + ' из ' + total + ')');
    L.push('');

    if (done === total) {
      L.push('✅ Все пункты выполнены');
    } else {
      L.push('❗ Не выполнено (' + (total - done) + '):');
      SECTIONS.forEach(function (s) {
        var left = s.items.filter(function (it) { return !state.checks[it.id]; });
        if (!left.length) return;
        L.push('• ' + s.name.ru + ':');
        left.forEach(function (it) { L.push('   – ' + it.step.t.ru); });
      });
    }
    L.push('');

    var notes = (state.notes || '').trim();
    L.push('📝 Замечания:');
    L.push(notes || 'нет');
    L.push('');

    var buy = [];
    SUPPLIES.forEach(function (s) {
      var st = supply(s[0]);
      if (!st.on) return;
      var q = (st.qty || '').trim();
      if (/^\d+([.,]\d+)?$/.test(q)) q += ' шт';
      buy.push('   – ' + s[1].ru + (q ? ' — ' + q : ''));
    });
    (state.other || '').split('\n').forEach(function (line) {
      line = line.trim();
      if (line) buy.push('   – ' + line);
    });
    if (buy.length) {
      L.push('🛒 Заявка на закуп:');
      L = L.concat(buy);
    } else {
      L.push('🛒 Закуп не требуется');
    }
    L.push('');
    L.push('🎥 Видео — следующим сообщением.');
    return L.join('\n');
  }

  // ---------- Actions ----------
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(tr(ok ? UI.copied : UI.copyFail));
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(tr(UI.copied)); }, fallback);
    } else {
      fallback();
    }
  }

  function sendReport() {
    state.checks[SEND_ID] = true;
    var box = document.querySelector('[data-id="' + SEND_ID + '"]');
    if (box) box.checked = true;
    if (state.start) state.end = Date.now();
    save();
    refresh();
    var num = phone.replace(/\D/g, '');
    var url = 'https://wa.me/' + num + '?text=' + encodeURIComponent(buildReport());
    var w = window.open(url, '_blank');
    if (!w) window.location.href = url;
  }

  // The recorded video lives only in memory until it is shared; it is never stored.
  var videoFile = null;
  var VIDEO_ID = 'fin-1';

  function videoLabel() {
    var mb = videoFile.size / (1024 * 1024);
    return '✓ ' + esc(tr(UI.videoReady)) + ' · ' + (mb < 10 ? mb.toFixed(1) : Math.round(mb)) + ' MB';
  }

  function onVideoPicked(file) {
    if (!file) return;
    videoFile = file;
    state.checks[VIDEO_ID] = true;
    var box = document.querySelector('[data-id="' + VIDEO_ID + '"]');
    if (box) box.checked = true;
    save();
    refresh();
    $('videoInfo').innerHTML = videoLabel();
    $('videoBlock').hidden = false;
    $('recordBtn').textContent = '🎥 2. ' + tr(UI.retakeVideo);
  }

  function shareVideo() {
    if (!videoFile) return;
    var data = { files: [videoFile] };
    if (navigator.canShare && navigator.canShare(data)) {
      navigator.share(data).catch(function (err) {
        if (err && err.name !== 'AbortError') toast(tr(UI.shareFail));
      });
    } else {
      toast(tr(UI.shareFail));
    }
  }

  function resetAll() {
    if (!window.confirm(tr(UI.resetConfirm))) return;
    videoFile = null;
    state = freshState();
    save();
    render();
    window.scrollTo(0, 0);
    toast(tr(UI.resetDone));
  }

  // ---------- Events ----------
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'videoInput') {
      onVideoPicked(el.files && el.files[0]);
      el.value = '';
      return;
    }
    var id = el.getAttribute('data-id');
    if (id) {
      if (el.checked) state.checks[id] = true; else delete state.checks[id];
      if (el.checked && ROOM_ITEM[id]) startTimer();
      save(); refresh();
      return;
    }
    var sup = el.getAttribute('data-sup');
    if (sup) {
      var st = supply(sup);
      st.on = el.checked;
      if (!el.checked) {
        st.qty = '';
        document.querySelector('[data-qty="' + sup + '"]').value = '';
      }
      save(); refresh();
    }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    var q = el.getAttribute('data-qty');
    if (q) {
      var st = supply(q);
      st.qty = el.value;
      if (el.value.trim()) {
        st.on = true;
        document.querySelector('[data-sup="' + q + '"]').checked = true;
      }
      save(); refresh();
      return;
    }
    if (el.id === 'other') { state.other = el.value; save(); }
    else if (el.id === 'notes') { state.notes = el.value; save(); }
    else if (el.id === 'phone') { phone = el.value; store(K_PHONE, phone); }
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('button') : null;
    if (!el) return;
    var l = el.getAttribute('data-lang');
    if (l) {
      if (l !== lang) { lang = l; store(K_LANG, lang); render(); }
      return;
    }
    var tg = el.getAttribute('data-toggle');
    if (tg) {
      if (state.open[tg]) delete state.open[tg]; else state.open[tg] = true;
      var card = el.parentNode;
      card.classList.toggle('open', !!state.open[tg]);
      el.setAttribute('aria-expanded', String(!!state.open[tg]));
      save();
      return;
    }
    switch (el.id) {
      case 'startBtn':
        startTimer(); save(); refresh();
        var r = $('rooms');
        if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
        break;
      case 'sendBtn': sendReport(); break;
      case 'copyBtn': copyText(buildReport()); break;
      case 'resetBtn': resetAll(); break;
      case 'shareVideo': shareVideo(); break;
      case 'installClose':
        store(K_HINT, '1');
        var hint = $('installHint');
        if (hint) hint.parentNode.removeChild(hint);
        break;
    }
  });

  // Keep the section heading visible below the sticky header when scrolling to it.
  function headerOffset() {
    var h = document.querySelector('header').offsetHeight + 8;
    document.documentElement.style.scrollPaddingTop = h + 'px';
  }
  window.addEventListener('resize', headerOffset);

  render();
  headerOffset();
  setInterval(tick, 1000);

  // The timer is based on the start time, so it is correct again as soon as the app returns from background.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
