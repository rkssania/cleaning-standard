<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #eef1f4;
    --ink: #172026;
    --ink-2: #4b5763;
    --muted: #6b7682;
    --border: #d9dee4;
    --accent: #0e7c72;
    --accent-ink: #ffffff;
    --accent-soft: #e0f2ef;
    --ok: #0a7a3e;
    --ok-soft: #e3f4ea;
    --warn: #9a5b00;
    --warn-soft: #fdf0d8;
    --bad: #b42318;
    --bad-soft: #fde7e5;
    --none: #5b6570;
    --none-soft: #eceff2;
    --focus: #1d6fd6;
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1418;
      --surface: #171e24;
      --surface-2: #1f2830;
      --ink: #e7ecf0;
      --ink-2: #b7c1ca;
      --muted: #8f9aa5;
      --border: #2d3842;
      --accent: #3cc3b3;
      --accent-ink: #062a26;
      --accent-soft: #123833;
      --ok: #5bd48f;
      --ok-soft: #133524;
      --warn: #f2b653;
      --warn-soft: #3a2c12;
      --bad: #ff8a80;
      --bad-soft: #43201e;
      --none: #a6b0ba;
      --none-soft: #252e36;
      --focus: #7ab4ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1418;
    --surface: #171e24;
    --surface-2: #1f2830;
    --ink: #e7ecf0;
    --ink-2: #b7c1ca;
    --muted: #8f9aa5;
    --border: #2d3842;
    --accent: #3cc3b3;
    --accent-ink: #062a26;
    --accent-soft: #123833;
    --ok: #5bd48f;
    --ok-soft: #133524;
    --warn: #f2b653;
    --warn-soft: #3a2c12;
    --bad: #ff8a80;
    --bad-soft: #43201e;
    --none: #a6b0ba;
    --none-soft: #252e36;
    --focus: #7ab4ff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  .wrap.wide { max-width: 1100px; }

  .brand { display: flex; align-items: center; gap: 10px; color: var(--accent); font-weight: 700; letter-spacing: .02em; font-size: 15px; text-transform: uppercase; }
  .brand svg { flex: none; }
  h1 { font-size: 26px; line-height: 1.2; margin: 8px 0 6px; }
  h2 { font-size: 20px; margin: 0 0 12px; }
  h3 { font-size: 17px; margin: 0 0 8px; }
  p.lead { color: var(--ink-2); margin: 0 0 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin: 0 0 16px;
  }
  .card > h2 { font-size: 18px; }

  label.field { display: block; margin: 0 0 16px; }
  .label { display: block; font-weight: 600; margin: 0 0 6px; }
  .req { color: var(--bad); }
  .hint { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }

  input[type=text], input[type=tel], input[type=email], input[type=number], input[type=date], input[type=search], select, textarea {
    width: 100%;
    min-height: 50px;
    padding: 12px 14px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    appearance: none;
    -webkit-appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px;
    background-size: 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible, .chip:focus-within {
    outline: 3px solid var(--focus);
    outline-offset: 1px;
  }
  input[aria-invalid=true], select[aria-invalid=true] { border-color: var(--bad); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }

  .checkline { display: flex; gap: 12px; align-items: flex-start; margin: 4px 0 16px; cursor: pointer; }
  .checkline input { width: 26px; height: 26px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .chip span {
    display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px;
    border: 1.5px solid var(--border); border-radius: 999px; background: var(--surface);
    font-size: 16px; user-select: none;
  }
  .chip input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .scale .chip span { justify-content: center; width: 100%; flex-direction: column; min-height: 58px; border-radius: 12px; line-height: 1.1; }
  .scale .chip b { font-size: 20px; }
  .scale .chip small { font-size: 11px; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 54px; padding: 12px 22px; border-radius: 12px;
    border: 1.5px solid transparent; font: inherit; font-weight: 700;
    cursor: pointer; text-decoration: none;
    background: var(--accent); color: var(--accent-ink);
  }
  .btn.block { width: 100%; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--border); font-weight: 600; }
  .btn.small { min-height: 42px; padding: 8px 14px; font-size: 15px; }
  .btn[disabled] { opacity: .6; cursor: progress; }

  .alert { border-radius: 12px; padding: 14px 16px; margin: 0 0 16px; }
  .alert.error { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
  .alert.success { background: var(--ok-soft); color: var(--ok); }
  .alert.warn { background: var(--warn-soft); color: var(--warn); }
  .done { text-align: center; padding: 32px 16px; }
  .done .big { font-size: 48px; line-height: 1; margin-bottom: 8px; }

  .footer { margin-top: 28px; text-align: center; font-size: 14px; color: var(--muted); }
  .footer a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
